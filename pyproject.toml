[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "superagent-cli"
version = "0.1.0"
description = "Superagent CLI: Multi-project coordinator for Claude Code, Codex CLI, and Antigravity"
readme = "README.md"
authors = [{ name = "Manuel", email = "dev@example.com" }]
requires-python = ">=3.10"
dependencies = [
    "textual>=0.80.0",
    "rich>=13.0.0",
]

[project.scripts]
superagent = "superagent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["superagent*"]
